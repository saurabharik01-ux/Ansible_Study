---
- name: installing nginx based on OS
  hosts: all
  become: true
  tasks:
    - name: installing nginx debian
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian" 
      
    - name: installing nginx rhel
      yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat" 
